  <path d="M180 112V140" class="arrow"/>
  <path d="M500 112V140" class="arrow"/>
  <path d="M820 112V140" class="arrow"/>
  <path d="M174 132L180 140L186 132Z M494 132L500 140L506 132Z M814 132L820 140L826 132Z" fill="#111"/>
  <path d="M500 421V440" class="arrow"/>
  <path d="M440 488H250V550 M560 488H750V550" class="arrow"/>

  <text x="500" y="746" class="small" text-anchor="middle">Lượt khuôn mặt được so với mẫu đã đăng ký; hệ thống chưa xác minh người thật.</text>
